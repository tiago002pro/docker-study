services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

  postgres:
    ports:
      - "127.0.0.1:${DB_PORT}:5432"

  # O que adicionamos:
  # - image: imagem oficial do Prometheus.
  # - ports: disponibiliza a interface em localhost:9090.
  # - volumes: monta a configuração e preserva os dados coletados.
  # - networks: conecta o Prometheus à mesma rede da API.

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: demo-dev-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - demo-network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: demo-dev-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - demo-network
    depends_on:
      - prometheus

  loki:
    image: grafana/loki:3.7.0
    container_name: demo-dev-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
    volumes:
      - loki_data:/tmp/loki
    command:
      - "-config.file=/etc/loki/local-config.yaml"
    networks:
      - demo-network

  alloy:
    image: grafana/alloy:latest
    container_name: demo-dev-alloy
    restart: unless-stopped
    ports:
      - "127.0.0.1:12345:12345"
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - alloy_data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    networks:
      - demo-network
    depends_on:
      - loki

volumes:
  prometheus_data:
    name: demo-dev_prometheus_data
  grafana_data:
    name: demo-dev_grafana_data
  loki_data:
    name: demo-dev_loki_data
  alloy_data:
    name: demo-dev_alloy_data