services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

  postgres:
    ports:
      - "127.0.0.1:${DB_PORT}:5432"

  # O que adicionamos:
  # - image: imagem oficial do Prometheus.
  # - ports: disponibiliza a interface em localhost:9090.
  # - volumes: monta a configuração e preserva os dados coletados.
  # - networks: conecta o Prometheus à mesma rede da API.

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: demo-dev-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - demo-network

  grafana:
    image: grafana/grafana:12.2.0
    container_name: demo-dev-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - demo-network
    depends_on:
      - prometheus

volumes:
  prometheus_data:
    name: demo-dev_prometheus_data
  grafana_data:
    name: demo-dev_grafana_data