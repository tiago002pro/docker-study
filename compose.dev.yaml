services:
  app:
    build:
      context: .
      dockerfile: Dockerfile

  postgres:
    ports:
      - "127.0.0.1:${DB_PORT}:5432"

  # O que adicionamos:
  # - image: imagem oficial do Prometheus.
  # - ports: disponibiliza a interface em localhost:9090.
  # - volumes: monta a configuração e preserva os dados coletados.
  # - networks: conecta o Prometheus à mesma rede da API.

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: demo-dev-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - demo-network

volumes:
  prometheus_data:
    name: demo-dev_prometheus_data