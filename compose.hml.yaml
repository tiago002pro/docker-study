
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - demo-hml-network

  app:
    image: ghcr.io/tiago002pro/demo-project:${APP_IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "8089:8088"
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-local}
      SERVER_PORT: 8088
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      - postgres
    networks:
      - demo-hml-network

volumes:
  postgres_data:
    name: ${POSTGRES_VOLUME_NAME}

networks:
  demo-hml-network:
